name: NotekeeperMac
options:
  bundleIdPrefix: app.notekeeper
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  NotekeeperCore:
    path: ../NotekeeperCore

targets:
  NotekeeperMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: NotekeeperCore
        product: NotekeeperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.notekeeper.mac
        PRODUCT_NAME: Notekeeper
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: NotekeeperMac.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Notekeeper
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
