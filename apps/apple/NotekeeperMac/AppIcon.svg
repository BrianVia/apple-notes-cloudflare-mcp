<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Yellow header band, matching Apple Notes' warm top stripe. -->
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD95A"/>
      <stop offset="1" stop-color="#FBC02D"/>
    </linearGradient>
    <!-- Paper body: very slight top-to-bottom deepening for depth. -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F2"/>
    </linearGradient>
    <!-- Back of the folded page: warmer, shaded toward the tip so the fold
         reads as "lit from top-left" like the rest of the icon. -->
    <linearGradient id="fold" x1="1" y1="0.1" x2="0.15" y2="0.95">
      <stop offset="0"    stop-color="#F2EADA"/>
      <stop offset="0.55" stop-color="#E4DAC4"/>
      <stop offset="1"    stop-color="#CFC2A6"/>
    </linearGradient>
    <!-- The sheet visible through the cut-out corner (the page below). -->
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6DFCF"/>
      <stop offset="1" stop-color="#D9D0BB"/>
    </linearGradient>
    <!-- Inner highlight along the very top — sells the lit-from-above feel. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Macos 11+ squircle corner ratio (231/1024 ≈ 0.2256). -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="231" ry="231"/>
    </clipPath>
    <!-- Page outline with the top-right corner triangle removed. Every layer
         that belongs to the *unfolded* sheet (paper, header, ruled lines,
         margin) gets clipped to this so it stops at the crease. -->
    <clipPath id="pageMinusFold">
      <polygon points="0,0 640,0 1024,340 1024,1024 0,1024"/>
    </clipPath>
    <!-- Drop shadow the folded flap casts onto the page below. -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="10" stdDeviation="12" flood-color="#2a1f00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- "Next sheet down" — what you see through the missing corner. -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#under)"/>

    <!-- Everything on the top sheet, clipped to the page-minus-corner shape. -->
    <g clip-path="url(#pageMinusFold)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#paper)"/>
      <rect x="0" y="0" width="1024" height="268" fill="url(#header)"/>
      <!-- Hairline separator between header and paper, in Apple Notes tan. -->
      <rect x="0" y="268" width="1024" height="2" fill="#D6A522" fill-opacity="0.55"/>

      <!-- Horizontal ruled lines on the paper body. Faint blue-gray so they
           read as "notebook" without competing with the fold. -->
      <g stroke="#9AA3B2" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
        <line x1="118" y1="360" x2="906" y2="360"/>
        <line x1="118" y1="452" x2="906" y2="452"/>
        <line x1="118" y1="544" x2="906" y2="544"/>
        <line x1="118" y1="636" x2="906" y2="636"/>
        <line x1="118" y1="728" x2="906" y2="728"/>
        <line x1="118" y1="820" x2="906" y2="820"/>
      </g>

      <!-- Red margin rule down the left — iconic Notes-pad detail. -->
      <line x1="88" y1="300" x2="88" y2="924" stroke="#E57373" stroke-opacity="0.55" stroke-width="3"/>
    </g>

    <!-- The folded flap itself — crease goes from (640,0) to (1024,340); the
         tip at (686, 381) is (1024,0) mirrored across that crease. -->
    <g filter="url(#foldShadow)">
      <polygon points="640,0 1024,340 686,381" fill="url(#fold)"/>
    </g>
    <!-- Faint highlight along the crease itself. -->
    <line x1="640" y1="0" x2="1024" y2="340"
          stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Top-edge gloss for depth. -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#rim)"/>
  </g>
</svg>
